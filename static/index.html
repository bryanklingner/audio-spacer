<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spacer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%2366c4b8'%3E%3Crect x='3' y='10' width='3' height='12' rx='1'/%3E%3Crect x='8' y='7' width='3' height='18' rx='1'/%3E%3Crect x='21' y='7' width='3' height='18' rx='1'/%3E%3Crect x='26' y='10' width='3' height='12' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
  --bg: #171a21;
  --surface: #1e222b;
  --line: #303645;
  --text: #c9cdd6;
  --muted: #7d8494;
  --accent: #66c4b8;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, sans-serif;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  padding: 12vh 1.25rem 4rem;
}
main { width: 100%; max-width: 26rem; }
.hidden { display: none !important; }

h1 {
  font-family: var(--mono);
  font-size: 1.6rem;
  font-weight: 500;
  letter-spacing: .55em;
  margin-bottom: 1rem;
  transition: letter-spacing .6s ease;
}
h1.working { animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { letter-spacing: .55em; }
  50% { letter-spacing: .95em; }
}
.tagline { color: var(--muted); margin-bottom: 2.5rem; }

form { display: grid; gap: 1.4rem; }
.switch { display: flex; gap: 1.1rem; margin-bottom: .5rem; }
.mode {
  background: none;
  border: 0;
  padding: 0 0 .15rem;
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 1px solid transparent;
}
.mode.on { color: var(--accent); border-bottom-color: var(--accent); }

input[type="text"] {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  font: inherit;
  padding: .6rem .75rem;
}
input[type="text"]::placeholder { color: #565d6e; }
input:focus-visible, button:focus-visible, .filebtn:focus-within,
.strip:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.filebtn {
  display: block;
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: 6px;
  padding: .6rem .75rem;
  color: var(--muted);
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.filebtn.has-file { color: var(--text); border-style: solid; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }

.cap {
  display: block;
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: .4rem;
}
.trow {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: .2rem;
}
.tval { font-family: var(--mono); font-size: .85rem; }
input[type="range"] {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 28px;
  margin: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  touch-action: pan-y;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 2px;
  background: var(--line);
  border-radius: 1px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 0;
  margin-top: -8px;
}
input[type="range"]::-moz-range-track {
  height: 2px;
  background: var(--line);
  border-radius: 1px;
}
input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  border: 0;
}

button.go {
  background: var(--accent);
  color: #0a1e1b;
  border: 0;
  border-radius: 6px;
  font: 500 1rem/1 inherit;
  padding: .85rem;
  cursor: pointer;
}
button.go:hover:not(:disabled) { filter: brightness(1.08); }
button.go:disabled { background: var(--line); color: var(--muted); cursor: wait; }

.error {
  display: none;
  border-left: 2px solid #b4574e;
  padding: .2rem 0 .2rem .75rem;
  color: #d0968f;
}
.error.show { display: block; }

#result { margin-top: 1rem; }
.summary {
  font-family: var(--mono);
  font-size: .85rem;
  color: var(--muted);
  margin-bottom: 1.1rem;
}
.summary b { color: var(--text); font-weight: 500; }

.strip {
  position: relative;
  height: 30px;
  cursor: pointer;
  margin-bottom: .9rem;
  border-bottom: 1px dotted var(--line);
}
.strip .seg {
  position: absolute;
  top: 6px;
  bottom: 6px;
  background: #8a92a6;
  border-radius: 1px;
  min-width: 1px;
}
.strip .head {
  position: absolute;
  top: 0;
  bottom: -1px;
  width: 2px;
  background: var(--accent);
  margin-left: -1px;
}
audio { width: 100%; }

.back {
  display: inline-block;
  background: none;
  border: 0;
  padding: 0;
  margin-top: 2rem;
  font-family: var(--mono);
  font-size: .78rem;
  letter-spacing: .08em;
  color: var(--muted);
  cursor: pointer;
}
.back:hover { color: var(--accent); }

footer {
  margin-top: 3.5rem;
  font-size: .8rem;
  color: #565d6e;
}
@media (prefers-reduced-motion: reduce) {
  h1, h1.working { animation: none; transition: none; }
}
</style>
</head>
<body>
<main>
  <h1 id="mark">spacer</h1>

  <section id="setup">
    <p class="tagline">Stretches the silences in a recording until it lasts as
    long as you want. The speech is left untouched.</p>

    <form id="form">
      <div>
        <div class="switch" role="group" aria-label="Audio source">
          <button type="button" class="mode on" id="mode-link"
                  aria-pressed="true">link</button>
          <button type="button" class="mode" id="mode-file"
                  aria-pressed="false">file</button>
        </div>
        <input type="text" id="url" aria-label="Audio link"
               placeholder="https:// — Waking Up share links work"
               autocomplete="off" spellcheck="false">
        <label class="filebtn hidden" id="filebtn">Choose a file…
          <input type="file" id="file"
                 accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac">
        </label>
      </div>
      <div>
        <div class="trow">
          <label class="cap" for="target" style="margin:0">Target length</label>
          <span class="tval" id="tval">30 min</span>
        </div>
        <input type="range" id="target" min="1" max="120" step="1" value="30">
      </div>
      <button class="go" id="go" type="submit">Add space</button>
      <div class="error" id="error"></div>
    </form>
  </section>

  <section id="result" class="hidden">
    <div class="summary" id="summary"></div>
    <div class="strip" id="strip" tabindex="0" aria-label="Seek"></div>
    <audio id="player" controls controlslist="nodownload"
           preload="metadata" oncontextmenu="return false"></audio>
    <button class="back" id="back" type="button">&larr; space another</button>
  </section>

  <footer>Spaced audio can be played for two hours, then it expires.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const fileIn = $("file"), urlIn = $("url");
const player = $("player"), strip = $("strip");
let mode = "link";

function setMode(m) {
  mode = m;
  $("mode-link").classList.toggle("on", m === "link");
  $("mode-file").classList.toggle("on", m === "file");
  $("mode-link").setAttribute("aria-pressed", m === "link");
  $("mode-file").setAttribute("aria-pressed", m === "file");
  urlIn.classList.toggle("hidden", m !== "link");
  $("filebtn").classList.toggle("hidden", m !== "file");
  $("error").classList.remove("show");
  if (m === "link") urlIn.focus();
}
$("mode-link").onclick = () => setMode("link");
$("mode-file").onclick = () => { setMode("file"); fileIn.click(); };

$("target").addEventListener("input", () => {
  $("tval").textContent = $("target").value + " min";
});

fileIn.addEventListener("change", () => {
  const f = fileIn.files[0];
  $("filebtn").classList.toggle("has-file", !!f);
  $("filebtn").firstChild.textContent = f ? f.name : "Choose a file…";
});

function clock(sec) {
  sec = Math.round(sec);
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ":" + String(s).padStart(2, "0");
}

function fail(msg) {
  const e = $("error");
  e.textContent = msg;
  e.classList.add("show");
}

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  $("error").classList.remove("show");
  const minutes = parseFloat($("target").value);
  if (!(minutes > 0)) return fail("Set a target length in minutes.");
  if (mode === "link" && !urlIn.value.trim())
    return fail("Paste a link to the audio.");
  if (mode === "file" && !fileIn.files[0])
    return fail("Choose an audio file.");

  const data = new FormData();
  if (mode === "file") data.append("file", fileIn.files[0]);
  data.append("url", mode === "link" ? urlIn.value.trim() : "");
  data.append("target", minutes * 60);

  $("go").disabled = true;
  $("go").textContent = "Widening the pauses…";
  $("mark").classList.add("working");
  try {
    const r = await fetch("/api/space", { method: "POST", body: data });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) return fail(body.detail || "Something went wrong. Try again.");
    show(body);
  } catch {
    fail("The server could not be reached. Try again.");
  } finally {
    $("go").disabled = false;
    $("go").textContent = "Add space";
    $("mark").classList.remove("working");
  }
});

$("back").onclick = () => {
  player.pause();
  $("result").classList.add("hidden");
  $("setup").classList.remove("hidden");
};

function show(info) {
  $("summary").innerHTML =
    `<b>${clock(info.input_seconds)}</b> → <b>${clock(info.output_seconds)}</b>` +
    ` · ${info.gap_count} pause${info.gap_count === 1 ? "" : "s"} widened`;

  strip.querySelectorAll(".seg, .head").forEach(el => el.remove());
  const total = info.output_seconds;
  let cursor = 0;
  for (const gap of info.gaps.concat([{ start: total, len: 0 }])) {
    if (gap.start > cursor) {
      const seg = document.createElement("div");
      seg.className = "seg";
      seg.style.left = (cursor / total * 100) + "%";
      seg.style.width = ((gap.start - cursor) / total * 100) + "%";
      strip.appendChild(seg);
    }
    cursor = gap.start + gap.len;
  }
  const head = document.createElement("div");
  head.className = "head";
  head.style.left = "0%";
  strip.appendChild(head);

  player.src = "/a/" + info.id + ".mp3";
  $("setup").classList.add("hidden");
  $("result").classList.remove("hidden");
  player.play().catch(() => {});

  let raf;
  function track() {
    head.style.left = (player.currentTime / total * 100) + "%";
    raf = requestAnimationFrame(track);
  }
  player.onplay = () => { cancelAnimationFrame(raf); track(); };
  player.onpause = player.onended = () => cancelAnimationFrame(raf);
  strip.onclick = ev => {
    const box = strip.getBoundingClientRect();
    player.currentTime = (ev.clientX - box.left) / box.width * total;
    head.style.left = (player.currentTime / total * 100) + "%";
  };
}
</script>
</body>
</html>
